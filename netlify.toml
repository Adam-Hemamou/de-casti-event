[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# En-têtes de sécurité, sur toutes les pages.
# La Content-Security-Policy ne restreint volontairement ni les scripts, ni les styles,
# ni les images (scripts intégrés d'Astro, GSAP, données structurées) : elle interdit
# seulement l'intégration du site dans un cadre externe, les plugins, le détournement de
# l'URL de base et l'envoi des formulaires vers un autre site.
# Strict-Transport-Security (HSTS) : à ajouter une fois le domaine définitif branché
# et le HTTPS vérifié (voir le rapport).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"

# Fichiers générés par Astro (noms uniques) : mise en cache longue.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
